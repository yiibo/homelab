---
version: "3"

networks:
    homelab:
        external: true

services:
    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        network_mode: "host"
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Australia/Melbourne
              #      - JELLYFIN_PublishedServerUrl=192.168.0.188 #optional
            - NVIDIA_DRIVER_CAPABILITIES=all
            - NVIDIA_VISIBLE_DEVICES=all
        volumes:
            - ./config:/config
            - ./cache:/cache
            - /data/media:/media
            - /data:/data
        ports:
            - 8096:8096
            - 8920:8920 #optional
            - 7359:7359/udp #optional
              #      - 1900:1900/udp #optional
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        restart: unless-stopped
        networks:
            - homelab
